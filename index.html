<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFE9DD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<title>Unsaid Word Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#EFE9DD; --tile:#FBF8F1; --empty:#E6DFD0; --ink:#1E1B16; --ink2:#5A544A; --ink3:#8F8778; --line:#DDD5C5;
    --accent:#E0A33A; --on-accent:#1E1B16;
    --display:"Zilla Slab", Georgia, serif;
    --sans:"IBM Plex Sans", -apple-system, system-ui, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme:dark; --paper:#171512; --tile:#2A2620; --empty:#221F1A; --ink:#EFE9DD; --ink2:#B8B0A2; --line:#2F2A22; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100dvh; }
  body { background:var(--paper); color:var(--ink); font:16px/1.5 var(--sans); -webkit-font-smoothing:antialiased;
         padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .wrap { max-width:1100px; margin-inline:auto; display:flex; flex-direction:column; gap:20px; min-height:calc(100dvh - 32px); }

  h1 { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin:0; padding-top:10px;
       font:700 clamp(26px, 6vw, 36px)/1.1 var(--display); letter-spacing:-.01em; }
  .wm { display:flex; gap:clamp(3px, 1vw, 5px); }
  .t { width:clamp(34px, 9vw, 44px); height:clamp(34px, 9vw, 44px); border-radius:9px; background:var(--tile);
       border:1.5px solid var(--ink); box-shadow:0 2px 0 var(--ink); display:grid; place-items:center;
       font:700 clamp(19px, 5vw, 25px)/1 var(--display); color:var(--ink); }
  .t.acc { background:var(--accent); color:var(--on-accent); transform:translateY(-8px); }
  h1 .sub { color:var(--accent); }

  form { display:grid; gap:12px; grid-template-columns:repeat(3, 1fr); }
  .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.rack { grid-column:1 / -1; }
  label { font-size:12px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink2); }
  label small { text-transform:none; letter-spacing:0; color:var(--ink3); font-size:12px; }
  input { width:100%; min-height:52px; padding:10px 14px; border-radius:12px; border:1.5px solid var(--ink); background:var(--tile); color:var(--ink);
          font:600 20px var(--display); letter-spacing:.12em; text-transform:uppercase; box-shadow:0 2px 0 var(--ink); }
  .rack input { font-size:26px; min-height:60px; }
  input::placeholder { color:var(--ink3); letter-spacing:.04em; font-weight:600; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 2px 0 var(--accent); }
  .actions { grid-column:1 / -1; display:flex; gap:10px; }
  button { min-height:52px; border-radius:12px; border:1.5px solid var(--ink); font:600 17px var(--sans); cursor:pointer; }
  button[type=submit] { flex:1; background:var(--accent); color:var(--on-accent); box-shadow:0 2px 0 var(--ink); }
  button[type=submit]:active { transform:translateY(2px); box-shadow:none; }
  button[type=reset] { padding-inline:20px; background:transparent; color:var(--ink); }

  .status { color:var(--ink2); font-size:14px; margin:0; min-height:21px; }
  .hint { color:var(--ink3); font-size:13px; margin:-8px 0 -12px; }
  .results { display:grid; gap:16px; grid-template-columns:1fr 1fr 2fr; align-items:start; align-content:start; flex:1; }
  .results[hidden] { display:none; }
  section { background:var(--tile); border:1.5px solid var(--line); border-radius:16px; padding:14px; min-width:0; }
  section h2 { font:700 20px var(--display); margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; }
  section h2 span { font:500 13px var(--sans); color:var(--ink3); }
  .words { display:flex; flex-wrap:wrap; gap:6px; }
  .w { padding:4px 9px; border-radius:8px; background:var(--empty); font:600 16px/1.3 var(--display); letter-spacing:.06em; }
  .w b { color:var(--accent); font-weight:700; }
  .none { color:var(--ink3); font-size:14px; }

  @media (max-width: 760px) {
    .results { grid-template-columns:1fr; }
  }
  @media (max-width: 520px) {
    form { grid-template-columns:1fr 1fr; }
    .field.contains { grid-column:1 / -1; order:3; }
    .actions { order:4; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 aria-label="Unsaid Word Finder"><span class="wm" aria-hidden="true"
    ><span class="t">U</span><span class="t">N</span><span class="t">S</span
    ><span class="t">A</span><span class="t">I</span><span class="t acc">D</span></span
    ><span class="sub" aria-hidden="true">Word Finder</span></h1>

  <form id="f" autocomplete="off">
    <div class="field rack">
      <label for="rack">Your letters <small>— use ? for a wildcard</small></label>
      <input id="rack" placeholder="e.g. RSTLNE?" autocapitalize="characters" spellcheck="false" enterkeyhint="search" inputmode="text">
    </div>
    <div class="field">
      <label for="starts">Starts</label>
      <input id="starts" placeholder="FL" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="field contains">
      <label for="contains">Contains <small>— _ = any letter</small></label>
      <input id="contains" placeholder="A_S" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="field">
      <label for="ends">Ends</label>
      <input id="ends" placeholder="ING" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    </div>
    <div class="actions">
      <button type="submit">Search</button>
      <button type="reset">Clear</button>
    </div>
  </form>

  <p class="hint">Starts, Contains and Ends letters are already on the board; your letters fill in the rest.</p>
  <p class="status" id="status" aria-live="polite"></p>

  <div class="results" id="results" hidden>
    <section><h2>3 letters <span id="c3"></span></h2><div class="words" id="g3"></div></section>
    <section><h2>4 letters <span id="c4"></span></h2><div class="words" id="g4"></div></section>
    <section><h2>5+ letters <span id="c5"></span></h2><div class="words" id="g5"></div></section>
  </div>
</div>

<script src="words.js"></script>
<script>
  const WORDS = window.WORDS.split("\n");
  const $ = id => document.getElementById(id);

  // Letters only; `_` and `?` both mean "any one letter" in the pattern fields.
  const clean = (s, wild) => s.toLowerCase().replace(wild ? /[^a-z?_]/g : /[^a-z?]/g, "");
  const pattern = s => clean(s, true).replace(/[?_]/g, ".");

  // Positions of the word given by the pattern fields (not `_`), which the rack doesn't have to supply.
  function fixedAt(set, pat, offset) {
    for (let i = 0; i < pat.length; i++) if (pat[i] !== ".") set.add(offset + i);
  }

  // Returns the indices of letters that had to come from a wildcard, or null if the rack can't spell
  // the rest of the word once the fixed positions are taken out.
  function fromRack(word, fixed, counts, wilds) {
    const left = counts.slice();
    const usedWild = [];
    for (let i = 0; i < word.length; i++) {
      if (fixed.has(i)) continue;
      const c = word.charCodeAt(i) - 97;
      if (left[c] > 0) left[c]--;
      else if (wilds-- > 0) usedWild.push(i);
      else return null;
    }
    return usedWild;
  }

  function render(word, wildAt) {
    const up = word.toUpperCase();
    if (!wildAt || !wildAt.length) return `<span class="w">${up}</span>`;
    let html = "";
    for (let i = 0; i < up.length; i++) html += wildAt.includes(i) ? `<b>${up[i]}</b>` : up[i];
    return `<span class="w">${html}</span>`;
  }

  function search() {
    const rack = clean($("rack").value, false);
    const starts = pattern($("starts").value);
    const contains = pattern($("contains").value);
    const ends = pattern($("ends").value);

    if (!rack && !starts && !contains && !ends) {
      $("status").textContent = "Enter some letters or a pattern.";
      $("results").hidden = true;
      return;
    }

    const counts = new Array(26).fill(0);
    let wilds = 0;
    for (const ch of rack) ch === "?" ? wilds++ : counts[ch.charCodeAt(0) - 97]++;

    const reStart = starts && new RegExp("^" + starts);
    // Lookahead so every place Contains matches is tried, overlapping ones included.
    const reContains = contains && new RegExp("(?=" + contains + ")", "g");
    const reEnd = ends && new RegExp(ends + "$");

    const groups = { 3: [], 4: [], 5: [] };
    let total = 0;
    for (const w of WORDS) {
      if (reStart && !reStart.test(w)) continue;
      if (reEnd && !reEnd.test(w)) continue;
      const spots = reContains ? [...w.matchAll(reContains)].map(m => m.index) : [null];
      if (!spots.length) continue;
      let wildAt = null;
      if (rack) {
        const base = new Set();
        if (starts) fixedAt(base, starts, 0);
        if (ends) fixedAt(base, ends, w.length - ends.length);
        for (const at of spots) {
          const fixed = new Set(base);
          if (at !== null) fixedAt(fixed, contains, at);
          wildAt = fromRack(w, fixed, counts, wilds);
          if (wildAt) break;
        }
        if (!wildAt) continue;
      }
      groups[Math.min(w.length, 5)].push(render(w, wildAt));
      total++;
    }

    for (const n of [3, 4, 5]) {
      $("g" + n).innerHTML = groups[n].length ? groups[n].join("") : `<span class="none">No words</span>`;
      $("c" + n).textContent = groups[n].length.toLocaleString();
    }
    $("status").textContent = `${total.toLocaleString()} word${total === 1 ? "" : "s"} found` +
      (wilds ? " · wildcard letters in gold" : "");
    $("results").hidden = false;
  }

  $("f").addEventListener("submit", e => {
    e.preventDefault();
    document.activeElement.blur(); // drop the mobile keyboard so results are visible
    search();
  });
  $("f").addEventListener("reset", () => {
    $("results").hidden = true;
    $("status").textContent = "";
    setTimeout(() => $("rack").focus());
  });
</script>
</body>
</html>
